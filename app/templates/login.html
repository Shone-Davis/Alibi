{% extends "base.html" %}
{% block title %}Sign in · Alibi{% endblock %}
{% block content %}
<div class="mx-auto mt-12 max-w-sm rounded-lg border border-slate-200 bg-white p-6">
  <h1 class="text-xl font-semibold">Sign in</h1>
  <p class="mt-1 text-sm text-slate-500">Seller access to your PayPal disputes.</p>
  <form method="post" class="mt-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="block text-sm">
      <span class="text-slate-700">Email</span>
      <input name="email" type="email" required autofocus autocomplete="username"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2">
    </label>
    <label class="block text-sm">
      <span class="text-slate-700">Password</span>
      <input name="password" type="password" required autocomplete="current-password"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2">
    </label>
    <button class="w-full rounded-md bg-blue-700 px-4 py-2 text-sm font-medium text-white hover:bg-blue-800">
      Sign in</button>
  </form>
</div>
{% endblock %}
