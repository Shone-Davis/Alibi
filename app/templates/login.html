{% extends "base.html" %}
{% block title %}Sign in to Alibi{% endblock %}
{% block content %}
<div class="mx-auto mt-6 max-w-sm sm:mt-14">
  <h1 class="font-serif text-3xl text-ink">Sign in</h1>
  <p class="mt-2 text-slate">Review your PayPal disputes and approve what gets sent.</p>
  <form method="post" class="mt-8 space-y-5 rounded-xl border border-line bg-paper p-6">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="block text-sm">
      <span class="font-medium">Email</span>
      <input name="email" type="email" required autofocus autocomplete="username"
             class="mt-1.5 w-full rounded-lg border border-line px-3 py-2 focus:border-brass focus:outline-none">
    </label>
    <label class="block text-sm">
      <span class="font-medium">Password</span>
      <input name="password" type="password" required autocomplete="current-password"
             class="mt-1.5 w-full rounded-lg border border-line px-3 py-2 focus:border-brass focus:outline-none">
    </label>
    <button class="w-full rounded-lg bg-ink px-4 py-2.5 text-sm font-medium text-white hover:bg-inkdeep">Sign in</button>
  </form>
</div>
{% endblock %}
