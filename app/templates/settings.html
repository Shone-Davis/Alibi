{% extends "base.html" %}
{% block title %}Settings · Alibi{% endblock %}
{% block content %}
<div class="max-w-lg">
  <h1 class="text-2xl font-semibold">Settings</h1>
  <form method="post" class="mt-6 space-y-6 rounded-lg border border-slate-200 bg-white p-6">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="block text-sm">
      <span class="font-medium">Refund threshold (USD)</span>
      <input name="refund_threshold" type="number" step="0.01" min="0" max="10000" required
             value="{{ s.refund_threshold }}" class="mt-1 w-40 rounded-md border border-slate-300 px-3 py-2">
      <span class="mt-1 block text-slate-500">Below this amount, the AI may suggest refunding instead of fighting.
        You still approve every refund.</span>
    </label>
    <label class="block text-sm">
      <span class="font-medium">Urgency window (hours)</span>
      <input name="urgent_hours" type="number" min="1" max="720" required
             value="{{ s.urgent_hours }}" class="mt-1 w-40 rounded-md border border-slate-300 px-3 py-2">
      <span class="mt-1 block text-slate-500">Disputes waiting on you with a deadline inside this window are
        marked urgent. 48 hours is 2 days; 504 hours is 21 days.</span>
    </label>
    <button class="rounded-md bg-blue-700 px-4 py-2 text-sm font-medium text-white hover:bg-blue-800">Save</button>
  </form>
</div>
{% endblock %}
